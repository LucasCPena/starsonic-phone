{{- /*
  O turnserver.conf do coturn do servidor de vídeo. O gerar.Turn o preenche com valores que o config.Ler
  conferiu (dois IPv4 e um nome no DNS) e com o segredo do turn.Segredo (base64url): nenhum quebra uma linha.
*/ -}}
# Gerado pelo starsonic-video configurar, a partir do config.json do agente. Não edite: o configurar o
# escreve de novo. É o TURN da seção 4 do docs/video-agente.md: o relay só vai para a própria VM.
listening-port=3478
tls-listening-port=5349
listening-ip={{.IPPrivado}}
relay-ip={{.IPPrivado}}
{{- if .IPsDiferentes}}
external-ip={{.IPPublico}}/{{.IPPrivado}}
{{- end}}
min-port={{.TurnInicio}}
max-port={{.TurnFim}}
fingerprint
use-auth-secret
static-auth-secret={{.Segredo}}
realm={{.Endereco}}
cert=/etc/starsonic-video/tls/turn-certificado.pem
pkey=/etc/starsonic-video/tls/turn-chave.pem
no-tcp
no-dtls
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-cli
no-tcp-relay
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
allowed-peer-ip={{.IPPrivado}}
{{- if .IPsDiferentes}}
allowed-peer-ip={{.IPPublico}}
{{- end}}
user-quota=12
total-quota=1200
syslog
