name: video

on:
  push:
    paths:
      - 'video-servidor/**'
      - 'docs/video-*.md'
      - '.github/workflows/video*.yml'
  pull_request:
    paths:
      - 'video-servidor/**'
      - 'docs/video-*.md'
      - '.github/workflows/video*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agente:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: video-servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: video-servidor/go.mod
      - name: gofmt
        run: |
          lista=$(gofmt -l .)
          if [ -n "$lista" ]; then echo "Fora do gofmt:"; echo "$lista"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Testes
        run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build (linux/amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o starsonic-video ./cmd/starsonic-video
      - uses: actions/upload-artifact@v4
        with:
          name: starsonic-video-linux-amd64
          path: video-servidor/starsonic-video
