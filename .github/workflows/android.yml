name: android

# App Android (etapa 1): o motor de ligações, testado no Linux contra o registrador falso de
# tests/smoke; as dependências nativas (PJSIP, Opus e Oboe) compiladas para o Android; o APK de debug,
# conferido e testado num emulador; e o APK de publicação (as três ABIs, com o R8), assinado e conferido.
# O android-release.yml chama este workflow com a versão e os segredos da chave para publicar; à mão (Actions →
# android → Run workflow), com a versão, é o ensaio de uma versão: tudo, também o código-fonte completo, sem publicar.
on:
  push:
    branches: ['**']   # tags v* passam pelo release.yml
    paths:
      - 'android/**'
      - 'starsonic/**'
      - 'tests/phone/**'
      - 'tests/smoke/fake_registrar.py'
      - 'tests/python/**'
      - 'tests/test_support.h'
      - 'build/android/**'
      - 'build/linux/**'
      - 'build/deps.lock'
      - 'branding/**'
      - '.github/workflows/android*.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'starsonic/**'
      - 'tests/phone/**'
      - 'tests/smoke/fake_registrar.py'
      - 'tests/python/**'
      - 'tests/test_support.h'
      - 'build/android/**'
      - 'build/linux/**'
      - 'build/deps.lock'
      - 'branding/**'
      - '.github/workflows/android*.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (X.Y.Z ou X.Y.Z-rc.N); vazio = 0.0.0. Com a versão, também o código-fonte completo"
        type: string
        default: ''
  workflow_call:
    inputs:
      version:
        description: "Versão (X.Y.Z ou X.Y.Z-rc.N); vazio = 0.0.0"
        type: string
        default: ''
      publicar:
        description: "true = o APK de publicação precisa da chave dos segredos e fica guardado para o android-release"
        type: boolean
        default: false
    # A chave de assinatura (spec 9.5): o .jks em base64 e a senha dele. O alias (starsonic) não é segredo, e a senha da
    # chave é a do arquivo (PKCS12).
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  # O build.yml (Windows) também roda estes testes, mas não num push só do Android (o paths-ignore dele). Sem o
  # GITHUB_ACTIONS: os scripts que os testes fazem falhar de propósito anotariam erros falsos num job verde.
  scripts:
    name: Testes dos scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Testes dos scripts (Python) e literais em ASCII
        run: |
          env -u GITHUB_ACTIONS python3 -m unittest discover -s tests/python
          python3 build/check_source_text.py

  phone-linux:
    name: Motor de ligações (Linux)
    # Fixo, como os outros jobs do Android: o ubuntu-latest vira Ubuntu 26 em 19/10/2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # O libuuid é preciso para compilar o pjproject e também para ligar os testes.
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y uuid-dev

      - name: Restaurar o pjproject
        id: pj-cache
        uses: actions/cache/restore@v4
        with:
          path: pj-linux
          key: pj-linux-v1-${{ hashFiles('build/deps.lock', 'build/linux/**') }}

      - name: Compilar o pjproject
        if: steps.pj-cache.outputs.cache-hit != 'true'
        run: bash build/linux/build-pjproject.sh work/pjproject-linux pj-linux

      - name: Guardar o pjproject
        if: steps.pj-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pj-linux
          key: ${{ steps.pj-cache.outputs.cache-primary-key }}

      - name: Testes do motor (pjsua2 contra o registrador falso)
        run: |
          cmake -S tests/phone -B build-phone -DPJPROJECT_PREFIX="$PWD/pj-linux"
          cmake --build build-phone -j 4
          ctest --test-dir build-phone --output-on-failure

  deps-android:
    name: Dependências (Android)
    # Os jobs do Android contam com o SDK do Android da imagem do Ubuntu 24.04 (o ubuntu-latest passa
    # para o Ubuntu 26 em 19/10/2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar o PJSIP, o Opus e o Oboe
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: android-deps
          key: android-deps-v1-${{ hashFiles('build/deps.lock', 'build/android/build-deps.sh', 'build/android/config_site.h') }}

      # O NDK do deps.lock já vem na imagem do runner; o sdkmanager só baixa se faltar.
      - name: Instalar o NDK
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          ndk="$(python3 -I -c 'import json; print(json.load(open("build/deps.lock", encoding="utf-8"))["android"]["ndk"])')"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - name: Compilar o PJSIP, o Opus e o Oboe
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash build/android/build-deps.sh android-deps work/android-deps

      - name: Guardar o PJSIP, o Opus e o Oboe
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android-deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # Também com o cache: a chave não inclui o elf_align.py.
      - name: Conferir o alinhamento de 16 KB do Oboe
        run: python3 -I build/android/elf_align.py android-deps/oboe/prefab/modules/oboe/libs/android.{arm64-v8a,armeabi-v7a,x86_64}/liboboe.so

      - name: Publicar as dependências
        uses: actions/upload-artifact@v4
        with:
          name: android-deps
          path: android-deps
          if-no-files-found: error

  apk:
    name: APK e emulador
    needs: deps-android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      APK: android/app/build/outputs/apk/debug/app-debug.apk
      TEST_APK: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
    steps:
      - uses: actions/checkout@v4

      - name: Baixar as dependências nativas
        uses: actions/download-artifact@v4
        with:
          name: android-deps
          path: android-deps

      # A versão do app: a pedida (android-release.yml ou à mão) ou 0.0.0; o versionCode sai dela (spec 9.4).
      - name: Versões do JDK, do Gradle, do NDK e do app
        id: lock
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          lock() { python3 -I -c 'import json, sys; print(json.load(open("build/deps.lock", encoding="utf-8"))["android"][sys.argv[1]])' "$1"; }
          echo "jdk=$(lock jdk)" >> "$GITHUB_OUTPUT"
          echo "gradle=$(lock gradle)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(lock ndk)" >> "$GITHUB_OUTPUT"
          version="${INPUT_VERSION:-0.0.0}"
          code="$(python3 -I build/android/version_code.py "$version" 2>&1)" || { echo "::error title=Versão::$code"; exit 1; }
          echo "STARSONIC_VERSION=$version" >> "$GITHUB_ENV"
          echo "STARSONIC_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versão $version (versionCode $code)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.lock.outputs.jdk }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.lock.outputs.gradle }}
          cache-provider: basic

      # Só a ABI do emulador, para o build ficar curto. Com --continue, um teste na JVM que falha não impede
      # os APKs (e os testes do emulador ainda rodam: a saída apks diz se eles existem). O que deu errado vira
      # anotação (o log do Actions nem sempre chega a quem acompanha o run pela API), inclusive cada teste
      # na JVM que falhou. Sem `| head` nos cortes: no Actions o SIGPIPE vem ignorado, e quem escreve num pipe
      # fechado sai com erro (o sed, com 4).
      - name: Compilar o APK e rodar os testes na JVM
        id: gradle
        run: |
          log="$RUNNER_TEMP/gradle.log"
          status=0
          gradle -p android --continue testDebugUnitTest assembleDebug assembleDebugAndroidTest \
            -Pstarsonic.deps="$PWD/android-deps" -Pstarsonic.abis=x86_64 \
            -Pstarsonic.version="$STARSONIC_VERSION" -Pstarsonic.versionCode="$STARSONIC_VERSION_CODE" 2>&1 | tee "$log" || status=$?
          if [ -f "$APK" ] && [ -f "$TEST_APK" ]; then echo "apks=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$status" -ne 0 ]; then
            annotate() {
              local text="$2"
              text="${text//'%'/'%25'}"; text="${text//$'\r'/}"; text="${text//$'\n'/'%0A'}"
              echo "::error title=$1::$text"
            }
            wrong="$(awk '/^\* What went wrong:/ { on = 1 } /^\* Try:/ { on = 0 } on && n < 40 { print substr($0, 1, 300); n++ }' "$log")"
            errors="$(awk '/^e: |error:|CMake Error|FAILED:|undefined symbol/ && n < 30 { print substr($0, 1, 300); n++ }' "$log")"
            if [ -n "$wrong" ]; then annotate "Gradle: o que deu errado" "$wrong"; fi
            if [ -n "$errors" ]; then annotate "Gradle: erros" "$errors"; fi
            if [ -z "$wrong$errors" ]; then annotate "Gradle" "$(tail -n 40 "$log")"; fi
            python3 -I - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET

          def escape(text):
              return text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")

          for path in sorted(glob.glob("android/app/build/test-results/testDebugUnitTest/*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in case.findall("failure") + case.findall("error"):
                      text = (problem.get("message") or problem.text or "").strip()[:1500]
                      title = "Teste na JVM " + case.get("classname", "").rsplit(".", 1)[-1]
                      print("::error title=%s::%s%%0A%s" % (title, escape(case.get("name", "")), escape(text)))
          EOF
          fi
          exit "$status"

      # O check_apk.py (spec 11.2), na ABI do emulador: as três bibliotecas alinhadas a 16 KB, a libstarsonic.so só com o
      # JNI à mostra (o llvm-nm do NDK), nenhum "MicroSIP", o perfil sem comentários, o aapt2 dump badging (pacote,
      # versão, minSdkVersion:'28', targetSdkVersion:'36', os nomes) e a assinatura, com a chave de debug que o Gradle
      # criou neste computador. O APK de publicação passa pelo mesmo script no job release, com mais conferências.
      - name: Conferir o APK
        if: ${{ !cancelled() && steps.gradle.outputs.apks == 'true' }}
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          nm=("$ANDROID_HOME/ndk/${{ steps.lock.outputs.ndk }}"/toolchains/llvm/prebuilt/*/bin/llvm-nm)
          keystore="${ANDROID_USER_HOME:-$HOME/.android}/debug.keystore"
          if [ ! -f "$keystore" ]; then echo "::error title=APK::não achei a chave de debug do Gradle em $keystore"; exit 1; fi
          keytool -exportcert -keystore "$keystore" -alias androiddebugkey -storepass android | sha256sum | cut -d' ' -f1 \
            > "$RUNNER_TEMP/debug.sha256"
          echo "build-tools $(basename "$tools"); chave de debug $(cat "$RUNNER_TEMP/debug.sha256")"
          python3 -I build/android/check_apk.py "$APK" --version "$STARSONIC_VERSION" --abis x86_64 \
            --cert-sha256 "$RUNNER_TEMP/debug.sha256" --aapt2 "${tools}aapt2" --apksigner "${tools}apksigner" --nm "${nm[0]}"

      # O registrador falso no runner, para o LoginScreenTest, o ServiceTest, o CallFlowTest, o AboutAndAccountTest
      # e o UpdatePromptTest: o emulador o vê em 10.0.2.2. A 5060 é a porta do branding/perfil.ini; a de controle
      # (5070) troca a senha (no teste da senha com acento e nos da senha trocada no servidor), conta os REGISTER
      # de cada ramal, liga para o ramal (RING), desliga (HANGUP) e mostra o registro de ligações (LOG). Ele fica
      # rodando nos passos seguintes.
      - name: Registrador falso
        if: ${{ !cancelled() && steps.gradle.outputs.apks == 'true' }}
        run: |
          nohup python3 -I tests/smoke/fake_registrar.py --host 0.0.0.0 --port 5060 --user 2001 \
            --password senha-certa --log "$RUNNER_TEMP/ua.txt" --transport-log "$RUNNER_TEMP/transporte.txt" \
            --control-port 5070 > "$RUNNER_TEMP/registrador.log" 2>&1 &
          for _ in $(seq 50); do
            if grep -q 'controle em' "$RUNNER_TEMP/registrador.log"; then exit 0; fi
            sleep 0.2
          done
          echo "::error title=Registrador falso::não subiu: $(tr '\n' ' ' < "$RUNNER_TEMP/registrador.log")"
          exit 1

      # Regra do udev do reactivecircus/android-emulator-runner: o emulador usa o KVM do runner.
      - name: Ativar o KVM
        if: ${{ !cancelled() && steps.gradle.outputs.apks == 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cada linha do script roda à parte; a primeira que falha encerra o passo. O ServiceTest deixa a conta
      # gravada; o check-boot.sh para o app à força e confere que o BOOT_COMPLETED (com o adb como root)
      # registra o ramal de novo e segura o processador acordado (o wake lock "starsonic:conexao"). Depois, o
      # CallFlowTest, o AboutAndAccountTest (menu, Sobre, diagnóstico, Editar e Sair) e, por último, o
      # UpdatePromptTest (o atualizador, com o canal de teste que o run-update-test.sh serve neste computador por um
      # `python3 -m http.server`, de pé só durante a classe): cada um começa parando o serviço que a reinstalação
      # (MY_PACKAGE_REPLACED) iniciou com a conta gravada e registra a dele por TCP. Antes de tudo, o set-locale.sh
      # põe o emulador em pt-BR (com o adb como root, e o Android reinicia): os botões da notificação de ligação
      # (Atender e Recusar) são do Android, no idioma do celular, como nos clientes.
      - name: Testes no emulador
        id: emulador
        if: ${{ !cancelled() && steps.gradle.outputs.apks == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            bash build/android/set-locale.sh pt-BR
            bash build/android/run-emulator-tests.sh "$APK" "$TEST_APK" br.com.starsonic.phone.NativeLoadTest
            bash build/android/run-emulator-tests.sh "$APK" "$TEST_APK" br.com.starsonic.phone.LoginScreenTest -e registrar 10.0.2.2 -e porta 5070 -e senha senha-certa
            bash build/android/run-emulator-tests.sh "$APK" "$TEST_APK" br.com.starsonic.phone.ServiceTest -e registrar 10.0.2.2 -e porta 5070 -e senha senha-certa
            bash build/android/check-boot.sh 5070 2001
            bash build/android/run-emulator-tests.sh "$APK" "$TEST_APK" br.com.starsonic.phone.CallFlowTest -e registrar 10.0.2.2 -e porta 5070 -e senha senha-certa
            bash build/android/run-emulator-tests.sh "$APK" "$TEST_APK" br.com.starsonic.phone.AboutAndAccountTest -e registrar 10.0.2.2 -e porta 5070 -e senha senha-certa
            bash build/android/run-update-test.sh "$APK" "$TEST_APK" -e registrar 10.0.2.2 -e porta 5070 -e senha senha-certa

      # O registrador guarda o User-Agent do último REGISTER e o protocolo do último REGISTER aceito. O
      # LoginScreenTest termina os registros aceitos com o da senha com acento, por TCP; o ServiceTest, o
      # BOOT_COMPLETED, o CallFlowTest, o AboutAndAccountTest e o UpdatePromptTest, depois dele, também terminam
      # por TCP.
      - name: Conferir o User-Agent e o protocolo
        if: ${{ !cancelled() && steps.emulador.outcome == 'success' }}
        run: |
          fail() { echo "::error title=Registrador falso::$1"; exit 1; }
          # O check_apk.py conferiu que o versionName do APK é esta versão.
          expected="Starsonic Phone Android/$STARSONIC_VERSION"
          ua="$(cat "$RUNNER_TEMP/ua.txt" 2>/dev/null || true)"
          [ "$ua" = "$expected" ] || fail "User-Agent do último REGISTER: '$ua' (esperado '$expected')"
          transport="$(cat "$RUNNER_TEMP/transporte.txt" 2>/dev/null || true)"
          [ "$transport" = "tcp" ] || fail "protocolo do último REGISTER aceito: '$transport' (esperado 'tcp')"
          echo "::notice title=Registrador falso::User-Agent '$ua'; o último REGISTER aceito veio por $transport"

      - name: Publicar o APK de debug
        if: ${{ !cancelled() && steps.gradle.outputs.apks == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: StarsonicPhone-android-debug-${{ github.sha }}
          path: ${{ env.APK }}
          if-no-files-found: error

  # O APK de publicação: as três ABIs, com o R8, assinado e conferido pelo check_apk.py, também no dex (o que o código
  # nativo e o Android acham pelo nome tem de estar lá com o nome de sempre). A chave é a dos segredos ANDROID_* (spec
  # 9.5), conferida contra o build/android/signing-cert.sha256, e só vale no main e nas tags android-v*. Em outro branch,
  # num PR ou sem os segredos, uma chave de ensaio criada aqui assina o APK só para as conferências, e esse APK não é
  # guardado; a publicação (publicar) não aceita a de ensaio. Com a versão, sai também o código-fonte completo; com a
  # versão e a chave de verdade, o APK e o código-fonte ficam guardados (artefato) para o android-release.yml.
  release:
    name: APK de publicação (três ABIs)
    needs: deps-android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RELEASE_APK: android/app/build/outputs/apk/release/app-release.apk
    steps:
      - uses: actions/checkout@v4

      - name: Baixar as dependências nativas
        uses: actions/download-artifact@v4
        with:
          name: android-deps
          path: android-deps

      - name: Versões do JDK, do Gradle, do NDK e do app
        id: lock
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          lock() { python3 -I -c 'import json, sys; print(json.load(open("build/deps.lock", encoding="utf-8"))["android"][sys.argv[1]])' "$1"; }
          echo "jdk=$(lock jdk)" >> "$GITHUB_OUTPUT"
          echo "gradle=$(lock gradle)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(lock ndk)" >> "$GITHUB_OUTPUT"
          version="${INPUT_VERSION:-0.0.0}"
          code="$(python3 -I build/android/version_code.py "$version" 2>&1)" || { echo "::error title=Versão::$code"; exit 1; }
          echo "STARSONIC_VERSION=$version" >> "$GITHUB_ENV"
          echo "STARSONIC_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versão $version (versionCode $code)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.lock.outputs.jdk }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.lock.outputs.gradle }}
          cache-provider: basic

      # Os segredos só passam por aqui e pelo passo do Gradle (pelo ambiente; nunca na linha de comando nem no log), e só
      # no main e nas tags android-v*. O alias (starsonic) não é segredo, e a senha da chave é a do arquivo (PKCS12). O
      # SHA-256 esperado fica fora da pasta da chave, que sai logo depois do build.
      - name: Chave de assinatura
        id: chave
        env:
          KEYSTORE_BASE64: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          PUBLICAR: ${{ inputs.publicar }}
        run: |
          dir="$RUNNER_TEMP/chave"
          mkdir -p "$dir"
          chmod 700 "$dir"
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "::error title=Chave::falta o segredo ANDROID_KEYSTORE_PASSWORD"
              exit 1
            fi
            # Um segredo colado pode vir com quebras de linha, CR ou espaços.
            if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$dir/starsonic.jks" 2> "$dir/base64.txt"; then
              echo "::error title=Chave::o segredo ANDROID_KEYSTORE_BASE64 não é um base64 válido: $(tr '\n' ' ' < "$dir/base64.txt")"
              exit 1
            fi
            # O keytool escreve os erros na saída padrão: o certificado vai para um arquivo, e a saída, para a anotação.
            if ! keytool -exportcert -keystore "$dir/starsonic.jks" -alias starsonic -storepass:env KEYSTORE_PASSWORD \
                -file "$dir/certificado.der" > "$dir/keytool.txt" 2>&1; then
              echo "::error title=Chave::o keytool não abriu a chave dos segredos (o base64 ou a senha?): $(grep -v 'Picked up' "$dir/keytool.txt" | tr '\n' ' ')"
              exit 1
            fi
            sha="$(sha256sum "$dir/certificado.der" | cut -d' ' -f1)"
            expected="$(tr -d ' :\r\n' < build/android/signing-cert.sha256 | tr 'A-F' 'a-f')"
            if [ "$sha" != "$expected" ]; then
              echo "::error title=Chave::a chave dos segredos tem o certificado $sha, e não o de build/android/signing-cert.sha256 ($expected)"
              exit 1
            fi
            { echo "real=true"; echo "keystore=$dir/starsonic.jks"; echo "alias=starsonic"; echo "cert=build/android/signing-cert.sha256"; } >> "$GITHUB_OUTPUT"
            echo "::notice title=Chave::a chave de assinatura dos segredos (certificado SHA-256 $sha)"
          else
            if [ "$PUBLICAR" = "true" ]; then
              echo "::error title=Chave::a publicação precisa do segredo ANDROID_KEYSTORE_BASE64 e só sai do main ou de uma tag android-v* (este run: $GITHUB_REF; README, seção Android)"
              exit 1
            fi
            keytool -genkeypair -keystore "$dir/ensaio.jks" -alias ensaio -keyalg RSA -keysize 2048 -validity 2 \
              -dname "CN=Ensaio do Starsonic Phone" -storepass ensaio -keypass ensaio
            keytool -exportcert -keystore "$dir/ensaio.jks" -alias ensaio -storepass ensaio | sha256sum | cut -d' ' -f1 \
              > "$RUNNER_TEMP/ensaio.sha256"
            { echo "real=false"; echo "keystore=$dir/ensaio.jks"; echo "alias=ensaio"; echo "cert=$RUNNER_TEMP/ensaio.sha256"; } >> "$GITHUB_OUTPUT"
            echo "::notice title=Chave::sem os segredos ANDROID_* (ou fora do main e das tags android-v*): o APK de publicação vai assinado com uma chave de ensaio criada aqui, só para as conferências, e não é guardado"
          fi

      - name: Compilar o APK de publicação
        env:
          STARSONIC_KEYSTORE_FILE: ${{ steps.chave.outputs.keystore }}
          STARSONIC_KEYSTORE_PASSWORD: ${{ steps.chave.outputs.real == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || 'ensaio' }}
          STARSONIC_KEY_ALIAS: ${{ steps.chave.outputs.alias }}
          STARSONIC_KEY_PASSWORD: ${{ steps.chave.outputs.real == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || 'ensaio' }}
        run: |
          log="$RUNNER_TEMP/gradle-release.log"
          status=0
          gradle -p android assembleRelease -Pstarsonic.deps="$PWD/android-deps" \
            -Pstarsonic.version="$STARSONIC_VERSION" -Pstarsonic.versionCode="$STARSONIC_VERSION_CODE" 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            annotate() {
              local text="$2"
              text="${text//'%'/'%25'}"; text="${text//$'\r'/}"; text="${text//$'\n'/'%0A'}"
              echo "::error title=$1::$text"
            }
            wrong="$(awk '/^\* What went wrong:/ { on = 1 } /^\* Try:/ { on = 0 } on && n < 40 { print substr($0, 1, 300); n++ }' "$log")"
            errors="$(awk '/^e: |error:|ERROR:|CMake Error|FAILED:|undefined symbol|Missing class|R8:/ && n < 30 { print substr($0, 1, 300); n++ }' "$log")"
            if [ -n "$wrong" ]; then annotate "Gradle (release): o que deu errado" "$wrong"; fi
            if [ -n "$errors" ]; then annotate "Gradle (release): erros" "$errors"; fi
            if [ -z "$wrong$errors" ]; then annotate "Gradle (release)" "$(tail -n 40 "$log")"; fi
            # O lint do release (lintVitalRelease) escreve os achados num relatório, fora do log.
            find android/app/build -path '*lint*' -name '*.txt' -size +0 2>/dev/null | while read -r report; do
              annotate "Lint (release): ${report##*/}" "$(awk 'n < 40 { print substr($0, 1, 300); n++ }' "$report")"
            done || true
            exit "$status"
          fi
          mkdir -p dist
          cp "$RELEASE_APK" "dist/StarsonicPhone-android-$STARSONIC_VERSION.apk"

      # Passe ou falhe o build, a chave decodificada sai do disco e o daemon do Gradle (que guarda o ambiente, com a
      # senha) para.
      - name: Apagar a chave
        if: always()
        run: |
          gradle --stop > /dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/chave"

      # O dexdump e o llvm-nm conferem o R8 (as regras do EngineSink, do PjAudioDevInfo, do atualizador e os nomes dos
      # natives da ponte, em cada ABI).
      - name: Conferir o APK de publicação
        run: |
          apk="dist/StarsonicPhone-android-$STARSONIC_VERSION.apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          nm=("$ANDROID_HOME/ndk/${{ steps.lock.outputs.ndk }}"/toolchains/llvm/prebuilt/*/bin/llvm-nm)
          echo "build-tools $(basename "$tools")"
          python3 -I build/android/check_apk.py "$apk" --version "$STARSONIC_VERSION" --release \
            --cert-sha256 "${{ steps.chave.outputs.cert }}" --aapt2 "${tools}aapt2" --apksigner "${tools}apksigner" \
            --nm "${nm[0]}" --dexdump "${tools}dexdump"
          echo "::notice title=APK de publicação::$(basename "$apk"): $(stat -c %s "$apk") bytes, SHA-256 $(sha256sum "$apk" | cut -d' ' -f1)"

      - name: Código-fonte completo
        if: inputs.version
        run: bash build/android/make_source_bundle.sh "$STARSONIC_VERSION" dist

      - name: Guardar o APK assinado e o código-fonte
        if: inputs.version && steps.chave.outputs.real == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: StarsonicPhone-android-${{ inputs.version }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
