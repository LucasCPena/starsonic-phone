name: build

on:
  push:
    branches: ['**']   # tags v* passam pelo release.yml, que chama este workflow
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Versão (X.Y.Z ou X.Y.Z-rc.N); vazio = da tag, ou 0.0.0"
        type: string
        default: ''
      channel:
        description: "Canal de atualização (estavel ou teste); vazio = teste para -rc.N, senão estavel"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  core-tests:
    name: Testes do núcleo (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testes C++ (doctest)
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests -j 4
          ctest --test-dir build-tests --output-on-failure

      - name: Testes dos scripts
        run: |
          if [ -d tests/python ]; then python3 -m unittest discover -s tests/python -v; fi
          python3 build/check_source_text.py

  windows:
    name: Windows (Win32, Release)
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar dependências
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/pjproject
            work/vcpkg
          key: deps-v1-${{ hashFiles('build/deps.lock', 'build/config_site.h', 'build/Build-Deps.ps1') }}

      - name: Compilar dependências (pjproject e vcpkg)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: .\build\Build-Deps.ps1 -WorkDir work

      - name: Guardar dependências
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            work/pjproject
            work/vcpkg
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Testes do núcleo (Windows)
        run: |
          # Invoke-Native publica as linhas de erro (compilador e doctest) como anotações.
          . .\build\BuildCommon.ps1
          Invoke-Native cmake @('-S', 'tests', '-B', 'build-tests-win', '-A', 'Win32')
          Invoke-Native cmake @('--build', 'build-tests-win', '--config', 'Release')
          Invoke-Native ctest @('--test-dir', 'build-tests-win', '-C', 'Release', '--output-on-failure')

      - name: Versão
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version) {
            $version = '0.0.0'
            if ('${{ github.ref }}' -match '^refs/tags/v(\d+\.\d+\.\d+(-rc\.[1-9]\d*)?)$') { $version = $Matches[1] }
          }
          $channel = $env:INPUT_CHANNEL
          if (-not $channel) { $channel = if ($version -match '-rc\.') { 'teste' } else { 'estavel' } }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "STARSONIC_VERSION=$version`nSTARSONIC_CHANNEL=$channel`n")
          Write-Host "versao: $version (canal $channel)"

      - name: Compilar o Starsonic Phone
        run: .\build\Build-App.ps1 -WorkDir work -Version $env:STARSONIC_VERSION -Channel $env:STARSONIC_CHANNEL -ProfilesFile branding\servidores.ini -OutDir out

      - name: Verificação de marca
        run: python build\check_branding.py --repo . --exe out\StarsonicPhone.exe

      - name: Teste de abrir e fechar
        run: .\tests\smoke\Test-StartStop.ps1 -AppDir out

      - name: Teste da faixa e da tela Sobre
        run: .\tests\smoke\Test-BrandUi.ps1 -AppDir out -Version $env:STARSONIC_VERSION

      - name: Teste da tela de Configurações
        run: .\tests\smoke\Test-Settings.ps1 -AppDir out

      - name: Compilar a versão de teste (perfil de CI)
        run: .\build\Build-App.ps1 -WorkDir work -Version 0.0.0 -Channel estavel -ProfilesFile tests\fixtures\servidores-ci.ini -OutDir out-ci

      - name: Teste das travas na inicialização
        run: .\tests\smoke\Test-Policy.ps1 -AppDir out-ci

      - name: Teste da tela Entrar (registrador SIP falso)
        run: .\tests\smoke\Test-Login.ps1 -AppDir out-ci

      - name: NSIS
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --version=3.10 -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Gerar o instalador
        run: .\build\Build-Installer.ps1 -Version $env:STARSONIC_VERSION -AppDir out -OutDir dist

      - name: Teste do instalador
        run: .\tests\smoke\Test-Installer.ps1 -Setup "dist\StarsonicPhone-$($env:STARSONIC_VERSION)-setup.exe" -AppDir out -Version $env:STARSONIC_VERSION

      - name: Código-fonte completo (versões)
        if: inputs.version
        run: .\build\Make-SourceBundle.ps1 -Version $env:STARSONIC_VERSION -WorkDir work -OutDir dist

      - name: Publicar o executável
        uses: actions/upload-artifact@v4
        with:
          name: StarsonicPhone-${{ github.sha }}
          path: out/
          if-no-files-found: error

      - name: Publicar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: StarsonicPhone-setup-${{ github.sha }}
          path: dist/
          if-no-files-found: error
