name: build

on:
  push:
    branches: ['**']   # tags v* passam pelo release.yml, que chama este workflow
    # Um push que só mexe no Android não compila o Windows (o workflow android cuida dele, inclusive dos testes
    # em Python); se mexer em mais alguma coisa, roda.
    paths-ignore:
      - 'android/**'
      - 'build/android/**'
      - 'build/linux/**'
      - '.github/workflows/android*.yml'
  pull_request:
  workflow_dispatch:   # com versão: build de versão completo (com o código-fonte), sem publicar
    inputs:
      version:
        description: "Versão (X.Y.Z ou X.Y.Z-rc.N); vazio = 0.0.0"
        type: string
        default: ''
      channel:
        description: "Canal de atualização (estavel ou teste); vazio = teste para -rc.N, senão estavel"
        type: string
        default: ''
      ensaio-atualizacao:
        description: "Ensaio da atualização: instala a v0.0.1-rc.7 do release, com conta e contato, e o instalador novo por cima"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Versão (X.Y.Z ou X.Y.Z-rc.N); vazio = da tag, ou 0.0.0"
        type: string
        default: ''
      channel:
        description: "Canal de atualização (estavel ou teste); vazio = teste para -rc.N, senão estavel"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  core-tests:
    name: Testes do núcleo (Linux)
    runs-on: ubuntu-24.04   # fixo: o ubuntu-latest vira Ubuntu 26 em 19/10/2026
    steps:
      - uses: actions/checkout@v4

      - name: Testes C++ (doctest)
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests -j 4
          ctest --test-dir build-tests --output-on-failure

      - name: Testes C++ do app de PC (doctest)
        run: |
          # A migração da rc.7 lê o call_log.db (SQLite) do MicroSIP.
          sudo apt-get install -y libsqlite3-dev
          cmake -S tests/desktop -B build-desktop-tests
          cmake --build build-desktop-tests -j 4
          ctest --test-dir build-desktop-tests --output-on-failure

      # Os testes rodam sem o GITHUB_ACTIONS: os scripts que eles fazem falhar de propósito anotariam erros falsos num
      # job verde.
      - name: Testes dos scripts
        run: |
          if [ -d tests/python ]; then env -u GITHUB_ACTIONS python3 -m unittest discover -s tests/python -v; fi
          python3 build/check_source_text.py

  # A interface do app novo (windows/ui): o build do esbuild e as telas no Chromium do Playwright, contra a ponte
  # falsa. As capturas de cada tela nos dois temas vão como artefato; o dist/ vai para o executável (Task 11).
  ui:
    name: Interface (Playwright, Linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: windows/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/ui/package-lock.json

      - name: Dependências (npm ci)
        run: npm ci

      - name: Build (tsc e esbuild)
        run: npm run build

      - name: Chromium do Playwright
        run: npx playwright install chromium --with-deps

      - name: Testes das telas (Playwright)
        run: npx playwright test

      - name: Publicar as capturas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interface
          path: windows/ui/test-results/capturas/
          if-no-files-found: warn

      - name: Publicar o relatório do Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            windows/ui/playwright-report/
            windows/ui/test-results/saida/
          if-no-files-found: ignore

      - name: Publicar a interface empacotada
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: windows/ui/dist/
          if-no-files-found: error

  windows:
    name: Windows (Win32, Release)
    runs-on: windows-2022
    needs: ui   # o app novo leva a interface empacotada (o artefato ui-dist)
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      # O Python dos scripts e da fumaça do app novo (o Playwright para Python fala com o WebView2 pelo CDP).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # As chaves dos caches (build/cache_keys.py): a das dependências nativas não muda com o bootstrapper do WebView2,
      # que tem um cache próprio (o build continua quando o endereço da Microsoft do deps.lock sai do ar).
      - name: Chaves dos caches
        id: cache-keys
        run: python build\cache_keys.py --github-output $env:GITHUB_OUTPUT

      - name: Restaurar dependências
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/pjproject
            work/vcpkg
            work/webview2
          key: ${{ steps.cache-keys.outputs.deps }}

      - name: Restaurar o bootstrapper do WebView2
        id: bootstrapper-cache
        uses: actions/cache/restore@v4
        with:
          path: work/webview2-bootstrapper
          key: ${{ steps.cache-keys.outputs.bootstrapper }}

      - name: Compilar dependências (pjproject, vcpkg e o SDK do WebView2)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: .\build\Build-Deps.ps1 -WorkDir work

      - name: Guardar dependências
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            work/pjproject
            work/vcpkg
            work/webview2
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Testes do núcleo (Windows)
        run: |
          # Invoke-Native publica as linhas de erro (compilador e doctest) como anotações.
          . .\build\BuildCommon.ps1
          Invoke-Native cmake @('-S', 'tests', '-B', 'build-tests-win', '-A', 'Win32')
          Invoke-Native cmake @('--build', 'build-tests-win', '--config', 'Release')
          Invoke-Native ctest @('--test-dir', 'build-tests-win', '-C', 'Release', '--output-on-failure')

      - name: Testes do app de PC (Windows)
        run: |
          # O núcleo do app de PC no MSVC (/W4, wchar_t de 16 bits), com o SQLite do vcpkg, mais o disco e o DPAPI de
          # verdade do executável novo (tests/win).
          . .\build\BuildCommon.ps1
          $vcpkgRoot = Join-Path (Resolve-Path work).Path 'vcpkg\installed\x86-windows-static'
          Invoke-Native cmake @('-S', 'tests/desktop', '-B', 'build-desktop-win', '-A', 'Win32', "-DCMAKE_PREFIX_PATH=$vcpkgRoot")
          Invoke-Native cmake @('--build', 'build-desktop-win', '--config', 'Release')
          # -V: o resumo do doctest (quantos casos rodaram) fica no log.
          Invoke-Native ctest @('--test-dir', 'build-desktop-win', '-C', 'Release', '-V')

      - name: Versão
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version) {
            $version = '0.0.0'
            if ('${{ github.ref }}' -match '^refs/tags/v(\d+\.\d+\.\d+(-rc\.[1-9]\d*)?)$') { $version = $Matches[1] }
          }
          $channel = $env:INPUT_CHANNEL
          if (-not $channel) { $channel = if ($version -match '-rc\.') { 'teste' } else { 'estavel' } }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "STARSONIC_VERSION=$version`nSTARSONIC_CHANNEL=$channel`n")
          Write-Host "versao: $version (canal $channel)"

      - name: Compilar o Starsonic Phone
        id: app
        run: .\build\Build-App.ps1 -WorkDir work -Version $env:STARSONIC_VERSION -Channel $env:STARSONIC_CHANNEL -ProfileFile branding\perfil.ini -OutDir out

      - name: Verificação de marca
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: python build\check_branding.py --repo . --exe out\StarsonicPhone.exe

      - name: Teste de abrir e fechar
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: .\tests\smoke\Test-StartStop.ps1 -AppDir out

      - name: Teste da faixa e da tela Sobre
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: .\tests\smoke\Test-BrandUi.ps1 -AppDir out -Version $env:STARSONIC_VERSION

      - name: Teste da tela de Configurações
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: .\tests\smoke\Test-Settings.ps1 -AppDir out

      - name: Teste das travas na inicialização
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: .\tests\smoke\Test-Policy.ps1 -AppDir out

      - name: Teste da tela Entrar (registrador SIP falso)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: .\tests\smoke\Test-Login.ps1 -AppDir out -Version $env:STARSONIC_VERSION

      # O app novo (windows/app: o WebView2 com a interface do job ui e o motor do Android), o que vai no instalador.
      - name: Baixar a interface empacotada
        id: ui-dist
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: windows/ui/dist

      - name: Compilar o app novo
        id: app-novo
        if: ${{ !cancelled() && steps.ui-dist.outcome == 'success' }}
        run: .\build\Build-Windows.ps1 -WorkDir work -Version $env:STARSONIC_VERSION -Channel $env:STARSONIC_CHANNEL -OutDir out-novo

      - name: Verificação de marca (app novo)
        if: ${{ !cancelled() && steps.app-novo.outcome == 'success' }}
        run: python build\check_branding.py --repo . --exe out-novo\StarsonicPhone.exe

      - name: Teste do app novo (janela, interface pronta e --sair)
        if: ${{ !cancelled() && steps.app-novo.outcome == 'success' }}
        run: .\tests\smoke\Test-WindowsApp.ps1 -AppDir out-novo

      - name: Compilar o app novo (build de teste, com o STARSONIC_PERFIL e o STARSONIC_SOM_NULO)
        id: app-novo-teste
        if: ${{ !cancelled() && steps.ui-dist.outcome == 'success' }}
        run: .\build\Build-Windows.ps1 -WorkDir work -Version $env:STARSONIC_VERSION -Channel $env:STARSONIC_CHANNEL -OutDir out-novo-teste -TestHooks

      - name: NSIS
        id: nsis
        if: ${{ !cancelled() && steps.app-novo.outcome == 'success' }}
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --version=3.10 -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # O instalador do app novo (Task 13): o exe e a pasta ui\ do out-novo, com o bootstrapper do WebView2.
      - name: Gerar o instalador
        id: installer
        if: ${{ !cancelled() && steps.nsis.outcome == 'success' }}
        run: .\build\Build-Installer.ps1 -Version $env:STARSONIC_VERSION -AppDir out-novo -OutDir dist -WorkDir work

      - name: Guardar o bootstrapper do WebView2
        if: ${{ !cancelled() && steps.installer.outcome == 'success' && steps.bootstrapper-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: work/webview2-bootstrapper
          key: ${{ steps.cache-keys.outputs.bootstrapper }}

      # O check de marca abre o instalador (os textos ficam dentro do LZMA): um instalador de verdade, feito aqui pelo
      # makensis com "MicroSIP" numa caixa de mensagem, tem de reprovar (no Linux o teste fica de fora sem o makensis).
      - name: Teste da verificação de marca com um instalador LZMA de verdade
        if: ${{ !cancelled() && steps.nsis.outcome == 'success' }}
        run: |
          $env:STARSONIC_MAKENSIS = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          python -m unittest -v tests.python.test_check_branding.CheckBrandingTest.test_a_real_lzma_installer_with_microsip_fails
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verificação de marca (app novo, interface e instalador)
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: python build\check_branding.py --repo . --app-novo out-novo\StarsonicPhone.exe --ui out-novo\ui --instalador "dist\StarsonicPhone-$($env:STARSONIC_VERSION)-setup.exe"

      # A fumaça do app instalado (numa pasta temporária) pelo CDP do WebView2, com ligações de verdade no registrador
      # falso; as capturas vão no artefato capturas-windows. O runner não tem placa de som, e sem nenhum dispositivo o
      # PJSIP não liga (PJMEDIA_EAUD_NODEFDEV): a fumaça instala o mesmo instalador gerado com o build de teste, cujo
      # exe aceita o perfil de teste (STARSONIC_PERFIL) e o dispositivo nulo (STARSONIC_SOM_NULO).
      - name: Gerar o instalador do build de teste
        id: installer-teste
        if: ${{ !cancelled() && steps.nsis.outcome == 'success' && steps.app-novo-teste.outcome == 'success' }}
        run: .\build\Build-Installer.ps1 -Version $env:STARSONIC_VERSION -AppDir out-novo-teste -OutDir dist-teste -WorkDir work

      - name: Dependências da fumaça do app novo (Playwright para Python)
        id: fumaca-deps
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: |
          python -m pip install --disable-pip-version-check --no-input -r tests\smoke\requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Fumaça do app novo instalado (CDP, ligações no registrador falso)
        if: ${{ !cancelled() && steps.fumaca-deps.outcome == 'success' && steps.installer-teste.outcome == 'success' }}
        run: .\tests\smoke\Test-InstalledApp.ps1 -Setup "dist-teste\StarsonicPhone-$($env:STARSONIC_VERSION)-setup.exe" -Capturas capturas-windows

      - name: Teste do instalador
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: .\tests\smoke\Test-Installer.ps1 -Setup "dist\StarsonicPhone-$($env:STARSONIC_VERSION)-setup.exe" -AppDir out-novo -Version $env:STARSONIC_VERSION -Capturas capturas-windows

      # Só à mão (workflow_dispatch com ensaio-atualizacao): a v0.0.1-rc.7 do release com uma conta (gravada pela
      # tela Entrar dela) e um contato, e o instalador novo por cima, com a rc.7 aberta.
      - name: Ensaio da atualização da rc.7
        if: ${{ !cancelled() && steps.fumaca-deps.outcome == 'success' && inputs['ensaio-atualizacao'] }}
        run: .\tests\smoke\Test-UpdateFromRc7.ps1 -Setup "dist\StarsonicPhone-$($env:STARSONIC_VERSION)-setup.exe" -Capturas capturas-windows

      - name: Publicar as capturas do Windows
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: capturas-windows
          path: capturas-windows/
          if-no-files-found: warn

      - name: Código-fonte completo (versões)
        if: inputs.version
        run: .\build\Make-SourceBundle.ps1 -Version $env:STARSONIC_VERSION -WorkDir work -OutDir dist

      - name: Publicar o executável
        uses: actions/upload-artifact@v4
        with:
          name: StarsonicPhone-${{ github.sha }}
          path: out/
          if-no-files-found: error

      - name: Publicar o app novo
        uses: actions/upload-artifact@v4
        with:
          name: StarsonicPhone-novo-${{ github.sha }}
          path: out-novo/
          if-no-files-found: error

      - name: Publicar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: StarsonicPhone-setup-${{ github.sha }}
          path: dist/
          if-no-files-found: error
