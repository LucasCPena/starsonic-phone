name: chat

on:
  push:
    paths:
      - 'chat-servidor/**'
      - 'docs/chat-*.md'
      - '.github/workflows/chat*.yml'
  pull_request:
    paths:
      - 'chat-servidor/**'
      - 'docs/chat-*.md'
      - '.github/workflows/chat*.yml'
  workflow_dispatch:

permissions:
  contents: read

# O go do runner é o do go.mod, e nunca baixa outro: com um go.mod que pede mais, o job falha em vez de baixar.
env:
  GOTOOLCHAIN: local

jobs:
  servidor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: chat-servidor
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Go do go.mod
        id: go
        # A linha "toolchain" do go.mod, e não a "go": com a segunda, o setup-go instala o 1.26.0 e o go baixa o
        # toolchain de novo em cada rodada.
        run: |
          versao=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' "$GITHUB_WORKSPACE/chat-servidor/go.mod")
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.versao }}
      - name: gofmt
        run: |
          lista=$(gofmt -l .)
          if [ -n "$lista" ]; then echo "Fora do gofmt:"; echo "$lista"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Testes
        run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build (linux/amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o starsonic-chat ./cmd/starsonic-chat
      - name: shellcheck
        run: shellcheck deploy/*.sh
      - name: Teste do copia.sh
        run: bash deploy/copia-teste.sh
      - name: Teste do instalar.sh
        run: bash deploy/instalar-teste.sh
      - name: systemd-analyze
        # O verify confere se o ExecStart de cada unidade existe e roda: põe o programa e o
        # copia.sh onde a instalação os põe.
        run: |
          sudo install -m 0755 starsonic-chat /usr/local/bin/starsonic-chat
          sudo install -D -m 0755 deploy/copia.sh /usr/local/lib/starsonic-chat/copia.sh
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin starsonic-chat
          # O verify sai com 0 até com uma chave errada, e só avisa. Qualquer linha na saída falha.
          saida=$(systemd-analyze verify deploy/*.service deploy/*.timer 2>&1) || { echo "$saida"; exit 1; }
          if [ -n "$saida" ]; then echo "$saida"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: starsonic-chat-linux-amd64
          path: chat-servidor/starsonic-chat

  pagina:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: chat-servidor/pagina
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chat-servidor/pagina/package-lock.json
      # Os testes das telas compilam o chat e o sobem no modo de teste (o chat.ts).
      - name: Versão do Go do go.mod
        id: go
        # A linha "toolchain" do go.mod, e não a "go": com a segunda, o setup-go instala o 1.26.0 e o go baixa o
        # toolchain de novo em cada rodada.
        run: |
          versao=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' "$GITHUB_WORKSPACE/chat-servidor/go.mod")
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.versao }}
          cache-dependency-path: chat-servidor/go.sum
      - name: npm ci
        run: npm ci
      - name: O jssip.js é o do pacote
        run: node montar-jssip.mjs --conferir
      - name: Testes
        run: node --test testes/*.test.mjs
      - name: Os tipos dos testes das telas
        run: npm run typecheck
      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes das telas (Playwright)
        run: npx playwright test
      - name: Publicar o relatório do Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright-pagina
          path: |
            chat-servidor/pagina/playwright-report/
            chat-servidor/pagina/test-results/
          if-no-files-found: ignore
