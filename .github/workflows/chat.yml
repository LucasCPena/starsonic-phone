name: chat

on:
  push:
    paths:
      - 'chat-servidor/**'
      - 'docs/chat-*.md'
      - '.github/workflows/chat*.yml'
  pull_request:
    paths:
      - 'chat-servidor/**'
      - 'docs/chat-*.md'
      - '.github/workflows/chat*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  servidor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: chat-servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: chat-servidor/go.mod
      - name: gofmt
        run: |
          lista=$(gofmt -l .)
          if [ -n "$lista" ]; then echo "Fora do gofmt:"; echo "$lista"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Testes
        run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build (linux/amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o starsonic-chat ./cmd/starsonic-chat
      - name: shellcheck
        run: shellcheck deploy/*.sh
      - name: systemd-analyze
        # O verify confere se o ExecStart de cada unidade existe e roda: põe o programa e o
        # copia.sh onde a instalação os põe.
        run: |
          sudo install -m 0755 starsonic-chat /usr/local/bin/starsonic-chat
          sudo install -D -m 0755 deploy/copia.sh /usr/local/lib/starsonic-chat/copia.sh
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin starsonic-chat
          systemd-analyze verify deploy/*.service deploy/*.timer
      - uses: actions/upload-artifact@v4
        with:
          name: starsonic-chat-linux-amd64
          path: chat-servidor/starsonic-chat
