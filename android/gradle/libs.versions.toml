# agp, kotlin (o plugin do compilador do Compose segue a versão do Kotlin), composeBom, oboe e ndk são
# os de build/deps.lock (chave "android"); tests/python/test_deps_lock.py confere.
[versions]
agp = "9.4.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
oboe = "1.11.0"
ndk = "30.0.16248370"
activityCompose = "1.10.1"
coreSplashscreen = "1.0.1"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
oboe = { module = "com.google.oboe:oboe", version.ref = "oboe" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
